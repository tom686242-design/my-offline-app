<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Pro - Elite Gamer</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --accent: #00ff88; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body.light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --accent: #2563eb; }
        
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); transition: 0.3s; }
        header { background: var(--card); padding: 1rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.1); }
        
        .search-container { padding: 15px; }
        #searchBar { width: 100%; padding: 12px; border-radius: 25px; border: none; background: var(--card); color: var(--text); border: 1px solid var(--accent); box-sizing: border-box; }

        nav { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.2); }
        nav button { background: var(--card); color: var(--text); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        nav button.active { background: var(--accent); color: #fff; }

        .container { padding: 20px; max-width: 800px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .save-box { display: flex; flex-direction: column; gap: 10px; }
        
        /* Shorter Link Display */
        .link-item { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 10px; border-bottom: 1px solid #ccc; }
        .link-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; font-weight: bold; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-dl { background: #6366f1; color: white; margin-left: 5px; }
        .btn-theme { background: var(--accent); color: white; }
    </style>
</head>
<body class="dark-mode">

<header>
    <h2 style="margin:0">VAULT <span style="color:var(--accent)">PRO</span></h2>
    <button class="btn btn-theme" onclick="toggleTheme()">🌓 Mode</button>
</header>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="Search guides or saved links..." onkeyup="runSearch()">
</div>

<nav id="mainNav">
    <button onclick="showSection('home')" class="active">Home</button>
    <button onclick="showSection('gaming')">Gaming</button>
    <button onclick="showSection('mc')">Minecraft</button>
</nav>

<div class="container">
    <div id="home" class="section active">
        <div class="card">
            <h3>Add Offline Link</h3>
            <div class="save-box">
                <input type="text" id="urlInput" placeholder="Paste URL here..." style="padding:10px; border-radius:5px;">
                <button class="btn btn-theme" onclick="saveUrl()">Save to App</button>
            </div>
            <div id="urlList"></div>
        </div>
    </div>

    <div id="gaming" class="section">
        <div class="card search-target"><h3>Gaming News</h3><p>Check back for daily updates.</p></div>
    </div>

    <div id="mc" class="section">
        <div class="card search-target"><h3>Villager Breeder</h3><p>Step 1: Beds. Step 2: Food. Step 3: Profit.</p></div>
        <div class="card search-target"><h3>Iron Farm</h3><p>Requires 3 villagers and a zombie in a cauldron.</p></div>
    </div>
</div>

<script src="app.js"></script>
<script>
    // THEME TOGGLE
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    // SEARCH ENGINE
    function runSearch() {
        let input = document.getElementById('searchBar').value.toLowerCase();
        let cards = document.querySelectorAll('.search-target, .link-item');
        cards.forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
        });
    }

    // SECTION NAV
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('#mainNav button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    // SAVE & SHORTEN LINK + DOWNLOAD
    function saveUrl() {
        const url = document.getElementById('urlInput').value;
        if(!url) return;

        // Make link look shorter (Removes https:// and trailing junk)
        let displayTitle = url.replace('https://','').replace('http://','').replace('www.','').split(/[/?#]/)[0];
        displayTitle = displayTitle.charAt(0).toUpperCase() + displayTitle.slice(1);

        const div = document.createElement('div');
        div.className = 'link-item';
        div.innerHTML = `
            <span class="link-text">${displayTitle}</span>
            <div>
                <button class="btn" onclick="window.open('${url}', '_blank')">🔗 Open</button>
                <button class="btn btn-dl" onclick="downloadLink('${url}', '${displayTitle}')">💾 Download</button>
            </div>
        `;
        document.getElementById('urlList').appendChild(div);
        document.getElementById('urlInput').value = '';
    }

    // DOWNLOAD AS FILE
    function downloadLink(url, title) {
        const blob = new Blob([`Guide Link: ${url}`], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${title}_Link.txt`;
        a.click();
    }
</script>
</body>
</html>
